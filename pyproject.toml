[project]
name = "computational-math-lab"
version = "0.1.0"
description = "Undergraduate mathematical exploration through reproducible experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
